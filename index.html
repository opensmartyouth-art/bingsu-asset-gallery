<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>빙수 월드 투어 — 에셋 갤러리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            border: 'hsl(214.3 31.8% 91.4%)',
            input: 'hsl(214.3 31.8% 91.4%)',
            background: 'hsl(0 0% 100%)',
            foreground: 'hsl(0 0% 3.9%)',
            primary: {
              DEFAULT: 'hsl(0 0% 9%)',
              foreground: 'hsl(0 0% 98%)',
            },
            secondary: {
              DEFAULT: 'hsl(0 0% 96.1%)',
              foreground: 'hsl(0 0% 9%)',
            },
            muted: {
              DEFAULT: 'hsl(0 0% 96.1%)',
              foreground: 'hsl(0 0% 45.1%)',
            },
            card: {
              DEFAULT: 'hsl(0 0% 100%)',
              foreground: 'hsl(0 0% 3.9%)',
            },
          },
          borderRadius: {
            lg: '0.5rem',
            md: '0.375rem',
            sm: '0.25rem',
          },
        },
      },
    }
  </script>
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; }
    .card { transition: box-shadow 0.15s, transform 0.15s; }
    .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.10); transform: translateY(-2px); }
    input[type=checkbox] { accent-color: hsl(0 0% 9%); }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: hsl(214.3 31.8% 85%); border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen bg-background text-foreground">

  <!-- Header (fixed) -->
  <header class="fixed top-0 left-0 right-0 z-20 bg-background border-b border-border px-8 py-4 flex items-center justify-between">
    <div>
      <h1 class="text-lg font-semibold tracking-tight">🍧 빙수 월드 투어 — 에셋 갤러리</h1>
      <p class="text-sm text-muted-foreground mt-0.5">사물 에셋 모음 · GLB 다운로드</p>
    </div>
    <span id="header-count" class="text-sm text-muted-foreground"></span>
  </header>

  <!-- Body (header 높이만큼 offset) -->
  <div class="flex pt-[65px] h-screen">

    <!-- Sidebar (fixed) -->
    <aside class="fixed top-[65px] left-0 w-60 h-[calc(100vh-65px)] bg-background border-r border-border overflow-y-auto p-5 flex flex-col gap-6 z-10">

      <!-- 검색 -->
      <div class="space-y-2">
        <p class="text-xs font-semibold text-muted-foreground uppercase tracking-wider">검색</p>
        <div class="relative">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-muted-foreground" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input id="search" type="text" placeholder="파일명 검색..."
            class="w-full pl-8 pr-3 py-1.5 text-sm bg-background border border-input rounded-md focus:outline-none focus:ring-2 focus:ring-foreground placeholder:text-muted-foreground">
        </div>
      </div>

      <!-- 국가 필터 -->
      <div class="space-y-2">
        <p class="text-xs font-semibold text-muted-foreground uppercase tracking-wider">국가</p>
        <div id="country-filters" class="space-y-1.5"></div>
      </div>

      <!-- Pixel Style 필터 -->
      <div class="space-y-2">
        <p class="text-xs font-semibold text-muted-foreground uppercase tracking-wider">Pixel Style</p>
        <div class="space-y-1.5">
          <label class="flex items-center gap-2 cursor-pointer text-sm hover:text-foreground text-muted-foreground py-0.5">
            <input type="checkbox" id="filter-2d" class="w-4 h-4 rounded">
            <span>2D 그래픽</span>
          </label>
        </div>
      </div>

      <!-- 결과 + 전체 다운로드 -->
      <div class="mt-auto space-y-3">
        <p class="text-xs text-muted-foreground" id="result-count"></p>
        <button id="download-all"
          class="w-full flex items-center justify-center gap-1.5 bg-primary text-primary-foreground text-xs font-medium py-2 px-3 rounded-md hover:opacity-80 transition-opacity">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          필터 결과 전체 다운로드
        </button>
      </div>
    </aside>

    <!-- Main (사이드바 너비만큼 offset) -->
    <main class="ml-60 flex-1 overflow-y-auto p-6 bg-muted/20">
      <div id="loading" class="flex items-center justify-center h-40 text-sm text-muted-foreground">
        <svg class="animate-spin w-4 h-4 mr-2" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
        </svg>
        에셋 불러오는 중...
      </div>
      <div id="grid" class="grid grid-cols-4 gap-4"></div>
      <div id="empty" class="hidden text-center py-20 text-sm text-muted-foreground">검색 결과가 없습니다.</div>

      <!-- 2D 그래픽 섹션 -->
      <div id="2d-section" class="hidden mt-8">
        <div class="flex items-center gap-3 mb-4">
          <h2 class="text-sm font-semibold tracking-tight">2D 그래픽</h2>
          <span class="text-xs text-muted-foreground border border-border rounded-full px-2 py-0.5">Pixel Style</span>
        </div>
        <div id="2d-grid" class="grid grid-cols-4 gap-4"></div>
      </div>
    </main>
  </div>

  <script>
    const GITHUB_USER = "opensmartyouth-art";
    const REPO_NAME   = "bingsu-asset-gallery";
    const RAW_BASE    = `https://raw.githubusercontent.com/${GITHUB_USER}/${REPO_NAME}/main/assets`;
    const API_BASE    = `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/assets`;

    let allCards = [];
    let activeCountries = new Set(['ALL']);

    async function loadAssets() {
      try {
        const res   = await fetch(API_BASE);
        const files = await res.json();
        const pngs  = files.filter(f => f.name.endsWith('.png'));
        const glbs  = new Set(files.filter(f => f.name.endsWith('.glb')).map(f => f.name));

        allCards = pngs.map(f => {
          const name    = f.name.replace('.png', '');
          const country = name.startsWith('COMMON') ? 'COMMON' : name.split('_')[0];
          return {
            name, country,
            imgUrl: `${RAW_BASE}/${f.name}`,
            glbUrl: glbs.has(f.name.replace('.png', '.glb'))
              ? `${RAW_BASE}/${f.name.replace('.png', '.glb')}`
              : null,
          };
        });

        buildFilters();
        renderCards();
        document.getElementById('loading').classList.add('hidden');
      } catch(e) {
        document.getElementById('loading').textContent = '불러오기 실패: ' + e.message;
      }
    }

    function buildFilters() {
      const countries = ['ALL', ...new Set(allCards.map(c => c.country))].sort();
      const wrap = document.getElementById('country-filters');
      wrap.innerHTML = '';
      countries.forEach(c => {
        const label = document.createElement('label');
        label.className = 'flex items-center gap-2 cursor-pointer text-sm hover:text-foreground text-muted-foreground py-0.5';
        label.innerHTML = `
          <input type="checkbox" class="country-cb w-4 h-4 rounded" value="${c}" ${c === 'ALL' ? 'checked' : ''}>
          <span>${c === 'ALL' ? '전체' : c}</span>`;
        wrap.appendChild(label);
      });

      document.querySelectorAll('.country-cb').forEach(cb => {
        cb.addEventListener('change', () => {
          if (cb.value === 'ALL') {
            activeCountries = cb.checked ? new Set(['ALL']) : new Set();
            document.querySelectorAll('.country-cb').forEach(b => { if (b.value !== 'ALL') b.checked = false; });
          } else {
            document.querySelector('.country-cb[value="ALL"]').checked = false;
            activeCountries.delete('ALL');
            cb.checked ? activeCountries.add(cb.value) : activeCountries.delete(cb.value);
          }
          renderCards();
        });
      });
    }

    function renderCards() {
      const q        = document.getElementById('search').value.toLowerCase();
      const grid     = document.getElementById('grid');
      const empty    = document.getElementById('empty');
      grid.innerHTML = '';

      const filtered = allCards.filter(c => {
        const matchName    = c.name.toLowerCase().includes(q);
        const matchCountry = activeCountries.has('ALL') || activeCountries.has(c.country);
        return matchName && matchCountry;
      });

      const count = filtered.length;
      document.getElementById('result-count').textContent = `${count}개 에셋`;
      document.getElementById('header-count').textContent = `${count}개`;
      empty.classList.toggle('hidden', count > 0);

      filtered.forEach(c => {
        const dlBtn = c.glbUrl
          ? `<a href="${c.glbUrl}" download
               class="flex items-center justify-center gap-1 w-full bg-primary text-primary-foreground text-xs font-medium py-1.5 rounded-md hover:opacity-80 transition-opacity">
               <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                 <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
               </svg>
               GLB 다운로드
             </a>`
          : `<span class="flex items-center justify-center w-full border border-input text-muted-foreground text-xs py-1.5 rounded-md">준비 중</span>`;

        const card = document.createElement('div');
        card.className = 'card bg-card border border-border rounded-lg overflow-hidden';
        card.innerHTML = `
          <div class="aspect-square bg-muted/50 overflow-hidden">
            <img src="${c.imgUrl}" alt="${c.name}" loading="lazy" class="w-full h-full object-contain p-3">
          </div>
          <div class="p-3 space-y-2">
            <span class="text-[10px] font-medium bg-secondary text-secondary-foreground px-2 py-0.5 rounded-full">${c.country}</span>
            <p class="text-xs font-medium text-card-foreground break-all leading-snug">${c.name}</p>
            ${dlBtn}
          </div>`;
        grid.appendChild(card);
      });
    }

    document.getElementById('search').addEventListener('input', renderCards);

    // 2D 에셋 로드
    async function load2DAssets() {
      try {
        const res   = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/assets/2d`);
        const files = await res.json();
        if (!Array.isArray(files)) return;
        const grid2d = document.getElementById('2d-grid');
        files.forEach(f => {
          const card = document.createElement('div');
          card.className = 'card bg-card border border-border rounded-lg overflow-hidden';
          card.innerHTML = `
            <div class="aspect-square bg-muted/50 overflow-hidden">
              <img src="https://raw.githubusercontent.com/${GITHUB_USER}/${REPO_NAME}/main/assets/2d/${f.name}"
                alt="${f.name}" loading="lazy" class="w-full h-full object-contain p-3">
            </div>
            <div class="p-3 space-y-2">
              <span class="text-[10px] font-medium bg-secondary text-secondary-foreground px-2 py-0.5 rounded-full">2D</span>
              <p class="text-xs font-medium text-card-foreground break-all leading-snug">${f.name.replace(/\.[^.]+$/, '')}</p>
            </div>`;
          grid2d.appendChild(card);
        });
      } catch(e) { console.error('2D 로드 실패', e); }
    }
    load2DAssets();

    document.getElementById('filter-2d').addEventListener('change', function() {
      const grid  = document.getElementById('grid');
      const cards = grid.querySelectorAll('.card');
      if (this.checked) {
        // 2D 카드 보여주기
        document.getElementById('2d-section').classList.remove('hidden');
      } else {
        document.getElementById('2d-section').classList.add('hidden');
      }
    });

    document.getElementById('download-all').addEventListener('click', () => {
      const q = document.getElementById('search').value.toLowerCase();
      const targets = allCards.filter(c => {
        const matchName    = c.name.toLowerCase().includes(q);
        const matchCountry = activeCountries.has('ALL') || activeCountries.has(c.country);
        return matchName && matchCountry && c.glbUrl;
      });
      if (!targets.length) { alert('다운로드할 GLB 파일이 없습니다.'); return; }
      targets.forEach((c, i) => {
        setTimeout(() => {
          const a = document.createElement('a');
          a.href = c.glbUrl; a.download = c.name + '.glb'; a.click();
        }, i * 300);
      });
    });

    loadAssets();
  </script>
</body>
</html>
